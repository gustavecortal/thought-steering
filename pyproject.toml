[project]
name = "thought-steering"
version = "1.0.0"
description = "Contrastive activation steering that sets how much a language model reframes negative thoughts."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1.6",  # renders the chat template as transformers does
    "numpy>=2.5.4",
    "onnx>=1.23.2",  # edits the graph to take the steering input
    "onnxruntime>=1.31.1",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
thought-steering = "thought_steering.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
