name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # The downloads are pinned to revisions in these files.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/thought-steering
          key: hf-${{ hashFiles('src/thought_steering/graph.py', 'src/thought_steering/prompt.py', 'src/thought_steering/pairs.py') }}
      - run: uv run pytest
      - run: uv run thought-steering chat "I failed my driving test again. I'll never be able to drive." --strength 0.3 --max-tokens 24
